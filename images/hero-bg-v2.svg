<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="stage" cx="50%" cy="38%" r="85%">
      <stop offset="0" stop-color="#232328"/>
      <stop offset="45%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>

    <!-- Основной луч света: конус от верха к центру, где стоит имя -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f2f2f0" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#f2f2f0" stop-opacity="0.08"/>
      <stop offset="1"   stop-color="#f2f2f0" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="48%" r="42%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8a92" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9c9d0"/>
      <stop offset="1" stop-color="#8a8a92" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#stage)"/>

  <!-- Конус света сверху, как прожектор со сцены, направленный туда, где текст -->
  <polygon points="760,0 1160,0 1420,1080 500,1080" fill="url(#beam)"/>

  <!-- Мягкое ядро свечения ровно за именем -->
  <rect width="1920" height="1080" fill="url(#coreGlow)"/>

  <!-- Тонкая световая линия-горизонт, огибающая нижнюю треть -->
  <path d="M-60 760 C 340 680, 700 820, 960 760 S 1580 680, 1980 760"
        fill="none" stroke="url(#rimLight)" stroke-width="1.6" opacity="0.5"/>
  <path d="M-60 800 C 360 730, 700 850, 960 800 S 1560 730, 1980 800"
        fill="none" stroke="url(#rimLight)" stroke-width="1" opacity="0.3"/>

  <!-- Едва заметная дуга-нимб над именем, как след дирижёрской палочки -->
  <path d="M420 300 Q 960 190 1500 300" fill="none" stroke="#5c5c64" stroke-width="1.4" opacity="0.4"/>

  <!-- Частицы пыли в луче света — сконцентрированы вокруг центра, редеют к краям -->
  <g fill="#f4f4f2">
    <circle cx="700"  cy="220" r="2"   opacity="0.5"/>
    <circle cx="820"  cy="340" r="1.4" opacity="0.4"/>
    <circle cx="960"  cy="180" r="1.8" opacity="0.55"/>
    <circle cx="1080" cy="300" r="1.5" opacity="0.4"/>
    <circle cx="1180" cy="230" r="2.2" opacity="0.5"/>
    <circle cx="640"  cy="420" r="1.6" opacity="0.42"/>
    <circle cx="1260" cy="400" r="1.7" opacity="0.42"/>
    <circle cx="900"  cy="470" r="1.3" opacity="0.35"/>
    <circle cx="1040" cy="500" r="1.5" opacity="0.38"/>
    <circle cx="780"  cy="600" r="1.4" opacity="0.32"/>
    <circle cx="1150" cy="620" r="1.6" opacity="0.34"/>
    <circle cx="960"  cy="700" r="1.2" opacity="0.28"/>

    <!-- редкие дальние частицы по краям сцены -->
    <circle cx="220"  cy="180" r="1.2" opacity="0.22"/>
    <circle cx="1720" cy="200" r="1.3" opacity="0.22"/>
    <circle cx="140"  cy="560" r="1.1" opacity="0.18"/>
    <circle cx="1800" cy="580" r="1.2" opacity="0.2"/>
    <circle cx="320"  cy="880" r="1.1" opacity="0.18"/>
    <circle cx="1620" cy="900" r="1.2" opacity="0.18"/>
  </g>

  <!-- Виньетка по краям, усиливает фокус на луче света в центре -->
  <rect width="1920" height="1080" fill="#050506" opacity="0.35"/>
  <rect width="1920" height="1080" fill="url(#coreGlow)" opacity="0.4"/>
</svg>
