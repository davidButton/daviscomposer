<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="heroBg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1c1c21"/>
      <stop offset="55%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>

    <radialGradient id="heroGlow" cx="50%" cy="46%" r="38%">
      <stop offset="0" stop-color="#e8e8ee" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#e8e8ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e8e8ee" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="heroWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4a52" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9a9aa2"/>
      <stop offset="1" stop-color="#4a4a52" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="heroWaveDim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33333a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5c5c66"/>
      <stop offset="1" stop-color="#33333a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#heroBg)"/>

  <!-- Мягкое свечение позади имени -->
  <rect width="1920" height="1080" fill="url(#heroGlow)"/>

  <!-- Дальний слой: тонкие бледные волны, почти на весь холст -->
  <g fill="none" stroke="#26262c" stroke-width="1.2" opacity="0.8">
    <path d="M-60 240 C 380 120, 760 340, 1140 220 S 1780 100, 1980 210"/>
    <path d="M-60 880 C 400 760, 780 960, 1160 840 S 1800 720, 1980 850"/>
    <path d="M-60 160 C 420 60, 800 240, 1180 140 S 1800 40, 1980 130"/>
  </g>

  <!-- Средний план: волны расходятся от центра к краям, будто звук рождается за именем -->
  <g fill="none">
    <path d="M-80 400 C 260 300, 560 470, 900 390 C 1000 365, 1050 365, 1100 390 C 1360 470, 1660 300, 2000 400"
          stroke="url(#heroWave)" stroke-width="2" opacity="0.55"/>
    <path d="M-80 430 C 270 335, 570 495, 900 420 C 1000 397, 1050 397, 1100 420 C 1360 495, 1660 335, 2000 430"
          stroke="url(#heroWave)" stroke-width="1.4" opacity="0.4"/>
    <path d="M-80 680 C 280 770, 580 610, 900 685 C 1000 707, 1050 707, 1100 685 C 1360 610, 1660 770, 2000 680"
          stroke="url(#heroWaveDim)" stroke-width="1.6" opacity="0.45"/>
    <path d="M-80 710 C 290 800, 590 640, 900 715 C 1000 738, 1050 738, 1100 715 C 1360 640, 1660 800, 2000 710"
          stroke="url(#heroWaveDim)" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Крупная "дышащая" дуга, огибающая текстовый блок сверху и снизу -->
  <path d="M280 330 Q 960 250 1640 330" fill="none" stroke="#54545c" stroke-width="1.4" opacity="0.5"/>
  <path d="M320 760 Q 960 850 1600 760" fill="none" stroke="#54545c" stroke-width="1.4" opacity="0.45"/>

  <!-- Тонкие вертикальные штрихи-акценты по краям, как далёкие импульсы -->
  <g stroke="#3d3d44" stroke-width="1.2" opacity="0.6">
    <line x1="150"  y1="480" x2="150"  y2="560"/>
    <line x1="230"  y1="500" x2="230"  y2="545"/>
    <line x1="1690" y1="500" x2="1690" y2="545"/>
    <line x1="1770" y1="480" x2="1770" y2="560"/>
  </g>

  <!-- Разреженное поле частиц-звёзд для глубины -->
  <g fill="#c9c9d2">
    <circle cx="180"  cy="160" r="1.6" opacity="0.4"/>
    <circle cx="420"  cy="90"  r="1.3" opacity="0.3"/>
    <circle cx="720"  cy="150" r="1.8" opacity="0.35"/>
    <circle cx="1240" cy="120" r="1.4" opacity="0.3"/>
    <circle cx="1560" cy="170" r="1.7" opacity="0.35"/>
    <circle cx="1800" cy="100" r="1.3" opacity="0.3"/>
    <circle cx="90"   cy="620" r="1.5" opacity="0.3"/>
    <circle cx="1860" cy="640" r="1.6" opacity="0.32"/>
    <circle cx="260"  cy="920" r="1.4" opacity="0.28"/>
    <circle cx="640"  cy="980" r="1.7" opacity="0.32"/>
    <circle cx="1300" cy="960" r="1.4" opacity="0.28"/>
    <circle cx="1700" cy="940" r="1.6" opacity="0.3"/>
    <circle cx="960"  cy="60"  r="1.3" opacity="0.25"/>
    <circle cx="960"  cy="1020" r="1.3" opacity="0.25"/>
  </g>

  <!-- Едва заметная виньетка по краям для фокуса на центре -->
  <rect width="1920" height="1080" fill="#0a0a0c" opacity="0.18"/>
</svg>
