<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f5"/>
      <stop offset="1" stop-color="#e9e9e6"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="640" fill="url(#bgc)"/>

  <!-- Пять линий "нотного стана", плывущие волной через весь баннер.
       Линии параллельны (сдвинуты на 22px) — читается как стан,
       но без единой ноты: нечему быть "неправильным" -->
  <g fill="none" stroke="#b9b9b4" stroke-width="1.4">
    <path d="M-40 280 C 340 180, 700 380, 1060 290 S 1700 170, 1960 260"/>
    <path d="M-40 302 C 340 202, 700 402, 1060 312 S 1700 192, 1960 282"/>
    <path d="M-40 324 C 340 224, 700 424, 1060 334 S 1700 214, 1960 304"/>
    <path d="M-40 346 C 340 246, 700 446, 1060 356 S 1700 236, 1960 326"/>
    <path d="M-40 368 C 340 268, 700 468, 1060 378 S 1700 258, 1960 348"/>
  </g>

  <!-- Второй стан, дальний и бледный, для глубины -->
  <g fill="none" stroke="#d3d3cf" stroke-width="1">
    <path d="M-40 130 C 400 220, 760 60, 1120 150 S 1720 250, 1960 140"/>
    <path d="M-40 148 C 400 238, 760 78, 1120 168 S 1720 268, 1960 158"/>
    <path d="M-40 166 C 400 256, 760 96, 1120 186 S 1720 286, 1960 176"/>
  </g>

  <!-- Тонкая тактовая черта и элегантные вертикальные штрихи-акценты -->
  <g stroke="#a8a8a2" stroke-width="1.6">
    <line x1="480"  y1="238" x2="480"  y2="330"/>
    <line x1="1360" y1="252" x2="1360" y2="344"/>
  </g>

  <!-- Крупная каллиграфическая дуга — как след смычка / лига -->
  <path d="M300 480 Q 960 320 1620 470" fill="none" stroke="#8f8f89" stroke-width="2.4" opacity="0.7"/>
  <path d="M420 520 Q 960 400 1500 512" fill="none" stroke="#b0b0aa" stroke-width="1.4" opacity="0.6"/>

  <!-- Точки-акценты на стане (абстрактные, не ноты) -->
  <g fill="#7d7d77">
    <circle cx="700"  cy="300" r="5" opacity="0.6"/>
    <circle cx="1120" cy="330" r="4" opacity="0.5"/>
    <circle cx="920"  cy="352" r="3.4" opacity="0.45"/>
    <circle cx="1540" cy="292" r="4.4" opacity="0.5"/>
  </g>
</svg>
