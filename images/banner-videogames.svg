<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f5"/>
      <stop offset="1" stop-color="#e7e7e4"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="640" fill="url(#bgv)"/>

  <!-- Едва заметная пиксельная сетка -->
  <g stroke="#dcdcd8" stroke-width="1" opacity="0.7">
    <path d="M0 160 H1920 M0 320 H1920 M0 480 H1920"/>
    <path d="M240 0 V640 M480 0 V640 M720 0 V640 M960 0 V640 M1200 0 V640 M1440 0 V640 M1680 0 V640"/>
  </g>

  <!-- Столбики эквалайзера по низу, серые на светлом -->
  <g fill="#c2c2bd" opacity="0.9">
    <rect x="120"  y="480" width="46" height="160"/>
    <rect x="200"  y="420" width="46" height="220"/>
    <rect x="280"  y="520" width="46" height="120"/>
    <rect x="360"  y="380" width="46" height="260"/>
    <rect x="440"  y="470" width="46" height="170"/>
    <rect x="1440" y="450" width="46" height="190"/>
    <rect x="1520" y="390" width="46" height="250"/>
    <rect x="1600" y="500" width="46" height="140"/>
    <rect x="1680" y="430" width="46" height="210"/>
    <rect x="1760" y="530" width="46" height="110"/>
  </g>
  <!-- Тёмные "пики" над столбиками -->
  <g fill="#8f8f89">
    <rect x="120"  y="460" width="46" height="12"/>
    <rect x="200"  y="400" width="46" height="12"/>
    <rect x="280"  y="500" width="46" height="12"/>
    <rect x="360"  y="360" width="46" height="12"/>
    <rect x="440"  y="450" width="46" height="12"/>
    <rect x="1440" y="430" width="46" height="12"/>
    <rect x="1520" y="370" width="46" height="12"/>
    <rect x="1600" y="480" width="46" height="12"/>
    <rect x="1680" y="410" width="46" height="12"/>
    <rect x="1760" y="510" width="46" height="12"/>
  </g>

  <!-- Пиксельные кластеры-"облака" -->
  <g fill="#b3b3ae" opacity="0.8">
    <rect x="320" y="130" width="24" height="24"/>
    <rect x="344" y="106" width="24" height="24"/>
    <rect x="368" y="130" width="24" height="24"/>
    <rect x="344" y="154" width="24" height="24"/>

    <rect x="1210" y="90"  width="24" height="24"/>
    <rect x="1234" y="114" width="24" height="24"/>
    <rect x="1258" y="90"  width="24" height="24"/>

    <rect x="820" y="70" width="20" height="20"/>
    <rect x="840" y="90" width="20" height="20"/>

    <rect x="1620" y="150" width="22" height="22"/>
    <rect x="1642" y="128" width="22" height="22"/>
  </g>

  <!-- Одиночные тёмные пиксели-звёзды -->
  <g fill="#7d7d77">
    <rect x="180"  y="80"  width="8" height="8" opacity="0.55"/>
    <rect x="560"  y="140" width="8" height="8" opacity="0.4"/>
    <rect x="760"  y="60"  width="8" height="8" opacity="0.5"/>
    <rect x="1050" y="120" width="8" height="8" opacity="0.5"/>
    <rect x="1330" y="70"  width="8" height="8" opacity="0.4"/>
    <rect x="1500" y="180" width="8" height="8" opacity="0.45"/>
    <rect x="1800" y="100" width="8" height="8" opacity="0.5"/>
    <rect x="80"   y="220" width="8" height="8" opacity="0.4"/>
    <rect x="980"  y="200" width="8" height="8" opacity="0.4"/>
  </g>
</svg>
